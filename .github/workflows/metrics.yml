name: Metrics

on:
  # Roda todo dia às 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Roda também a cada push na branch principal
  push:
    branches: ["main"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card principal: commits, PRs, issues, atividade
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          # Inclui repositórios privados nas contagens
          repositories_affiliations: owner, collaborator, organization_member

      # Card de linguagens
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used, recently-used
          # Analisa os seus commits com o linguist em vez de usar
          # as estatisticas prontas do repositorio
          plugin_languages_indepth: yes
          # Conta so codigo: exclui dados, markup e texto
          plugin_languages_categories: programming
          # Esconde linguagens abaixo de 2%
          plugin_languages_threshold: 2%
          # Remova o # e ajuste se quiser pular um repositorio especifico
          # plugin_languages_skipped: LDTLuis/nome-do-repo
          plugin_languages_recent_days: 30
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner, collaborator
